name: Checks

# Runs the quality gate on every feature-branch push. Deploys are NOT done
# here: Vercel's git integration builds a preview for every branch on its
# own (zero configuration beyond importing the repo into Vercel), and posts
# the preview URL on any open PR. These checks are what branch protection
# on main should require.

on:
  push:
    branches-ignore:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_ENV: staging
