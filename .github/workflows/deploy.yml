name: Production Migrations

# Runs on merge to main: re-runs the quality gate, then applies database
# migrations — staging first, then production. The production CODE deploy is
# NOT done here: Vercel's git integration deploys main to production on its
# own.
#
# Ordering caveat that follows from that: Vercel's deploy starts as soon as
# main is pushed, so new code can be live up to a minute before these
# migrations finish. Write schema changes additively and merge them BEFORE
# the code that depends on them (two merges: schema first, then the
# feature) — see supabase/migrations/README.md.

on:
  push:
    branches:
      - main

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PROD_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_ENV: production

      # Fail loudly if the Supabase secrets are missing — silently skipping
      # production migrations would leave code and schema out of sync.
      - name: Check migration secrets
        run: |
          if [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ] || [ -z "${{ secrets.SUPABASE_PROJECT_REF }}" ] || [ -z "${{ secrets.STAGING_SUPABASE_PROJECT_REF }}" ]; then
            echo "::error::Supabase migration secrets are missing (SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF / STAGING_SUPABASE_PROJECT_REF). See README 'Add GitHub Actions Secrets' — migrations were NOT applied."
            exit 1
          fi

      # Staging first: a migration that fails here stops the job before
      # production is touched.
      - name: Apply DB migrations (staging)
        run: npx supabase db push --project-ref ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}

      - name: Apply DB migrations (production)
        run: npx supabase db push --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.PROD_SUPABASE_DB_PASSWORD }}
